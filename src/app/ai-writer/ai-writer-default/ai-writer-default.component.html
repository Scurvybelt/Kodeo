<div class="hero-banner-two z-1 position-relative mt-200 lg-mt-150">
    <div class="container position-relative">
        <div class="row">
            <div class="col-xl-10 col-lg-8 m-auto text-center">
                <h1 class="hero-heading wow fadeInUp font-manrope">Generate high-quality post in minutes</h1>
                <p class="fs-28 font-manrope text-white pt-5 pb-30 lg-pb-20 wow fadeInUp" data-wow-delay="0.1s">
                    Knowledge, answers, ideas. Just a click away</p>
                <a routerLink="/ai-writer/service-v2" class="btn-three wow fadeInUp" data-wow-delay="0.2s">Generate Now</a>
            </div>
        </div>
        <img src="assets/images/assets/ils_04.svg" alt="" class="w-100 mt-70 lg-mt-50 wow fadeInUp"
            data-wow-delay="0.3s">
    </div>
    <div class="client-logo-wrapper mt-80 lg-mt-40">
        <div class="container">
            <p class="font-manrope fs-24 fw-500 text-center mb-40">Over <span class="fw-600 text-white">32K+</span>
                software businesses growing with piku</p>
            <div class="partner-logo-one">
                <owl-carousel-o [options]="customOptions">
                    <ng-container *ngFor="let logo of logos">
                        <ng-template carouselSlide>
                            <img [src]="logo" width="40" height="50" alt="Partner Logo" class="px-5" />
                        </ng-template>
                    </ng-container>
                </owl-carousel-o>
            </div>
        </div>
    </div>
    <img src="assets/images/shape/shape_11.svg" alt="" class="shapes shape_01">
    <img src="assets/images/shape/shape_12.svg" alt="" class="shapes shape_02">
</div>

<app-feature-section></app-feature-section>
<app-feedback-section></app-feedback-section>
<app-intigration-section></app-intigration-section>
<app-price-section></app-price-section>
<app-faq-section></app-faq-section>
<app-ai-writer-fancy-banner-section></app-ai-writer-fancy-banner-section>
